[project]
name = "pjm-data"
version = "0.1.0"
description = "Data preparation pipeline for the CrocoSign Polish Sign Language (PJM) corpus"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "contractions>=0.1.73",
    "google-genai>=1.43.0",
    "google-generativeai>=0.8.5",
    "h5py>=3.15.1",
    "hunspell>=0.5.5",
    "ipykernel>=6.30.1",
    "language-tool-python>=2.9.4",
    "morfeusz2>=1.99.11",
    "numpy",
    "pandas>=2.3.2",
    "plotly>=6.6.0",
    "pyspellchecker>=0.8.3",
    "pytest>=8.4.2",
    "requests>=2.32.5",
    "sentencepiece>=0.2.1",
    "spacy[en-core-web-sm]>=3.8.11",
    "transformers>=4.56.0",
    "ultralytics>=8.3.202",
    "huggingface-hub>=0.35.3",
    "webdataset>=1.0.2",
    "webvtt-py>=0.5.1",
    "tqdm>=4.67.1",
    "lmdb>=2.2.0",
    "msgpack>=1.1.1",
    "nbformat>=5.10.4",
    "beautifulsoup4",
    "python-dotenv",
    "matplotlib",
]
